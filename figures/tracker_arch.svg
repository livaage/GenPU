<text x="46.0" y="1038.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#5b6673" fill-opacity="1.0" text-anchor="start">an event is the union of these per-particle responses — the tracker and calo heads are independent and never see each other.</text>
